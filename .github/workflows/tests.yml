name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner (the Skill itself uses the standard library only)
        run: pip install -r requirements-dev.txt
      - name: Run tests (all HTTP is faked, no network or secrets needed)
        run: pytest -v
      - name: Build the claude.ai upload zip
        run: python tools/package_skill.py
